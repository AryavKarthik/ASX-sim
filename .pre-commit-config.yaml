# Checks that run automatically on every `git commit`.
# Install once with:  uv tool install pre-commit  &&  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5 # keep in step with the ruff version in backend/uv.lock
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Blocks commits that contain API keys or other secrets.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
