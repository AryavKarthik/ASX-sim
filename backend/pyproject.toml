[project]
name = "asxsim"
version = "0.1.0"
description = "Realistic ASX day-trading simulator on the live (20-minute delayed) market, with analytics and an AI coach."
authors = [{ name = "Aryav Karthik" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.80",
    "exchange-calendars>=4.5",
    "fastapi>=0.115",
    "pandas>=2.2",
    "pyarrow>=17",
    "uvicorn[standard]>=0.32",
    "yfinance>=0.2.54",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asxsim"]

# ---------- Lint & format ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "B",       # bugbear (likely bugs)
    "UP",      # modern syntax
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

# ---------- Types ----------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "pyarrow", "pyarrow.*", "exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

# ---------- Tests ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Raised inside exchange_calendars, not our code; remove once the library updates.
    "ignore:Series.values returning an ndarray that drops timezone",
    # FastAPI's TestClient still imports httpx; harmless for tests.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["asxsim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
