[project]
name = "asxsim"
version = "0.1.0"
description = "Realistic ASX trading simulator: matching engine, replay, analytics and an AI coach."
authors = [{ name = "Aryav Karthik" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "yfinance>=0.2.54",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asxsim"]

# ---------- Lint & format ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "B",       # bugbear (likely bugs)
    "UP",      # modern syntax
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

# ---------- Types ----------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# ---------- Tests ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["asxsim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
